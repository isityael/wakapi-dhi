# Wakapi API workflow: upgrade from the last published release on Postgres
# (the production dialect), then the Bruno API suite on Postgres and SQLite.
# The current build is compiled once and shared across both runs.
when:
  - event: pull_request
  - event: push
    branch: master

steps:
  # The last published image is what production runs, so the upgrade test
  # starts from it instead of upstream's GitHub release.
  - name: previous-release
    image: dhi.io/crane:0.22.1-debian13-dev@sha256:82b1dc28811889cba5bcab21f599349347944a11faee62dcd5cfc43b16d28838
    commands:
      - mkdir -p testing/previous
      - crane export --platform linux/amd64 git.m0sh1.cc/isityael/wakapi-dhi:latest - | tar -xf - -C testing/previous app/wakapi
      - testing/previous/app/wakapi --version || true

  - name: api-tests
    image: dhi.io/golang:1.27.3-alpine3.24-dev@sha256:2ceb813d69b9c82501323484e0c0ae612efde281f5dffce2a3d83a79a9c87304
    environment:
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
      GOFLAGS: -mod=vendor
      WAKAPI_TEST_EXTERNAL_DB: "1"
      WAKAPI_DB_HOST: database
      WAKAPI_DB_PORT: "5432"
      WAKAPI_TEST_PREVIOUS_BINARY: previous/app/wakapi
    commands:
      - apk add --no-cache bash curl sqlite postgresql-client nodejs npm
      # The Bruno install (~55s) and the Go build (~90s) are independent, so
      # they overlap; both suites then reuse the prebuilt ./wakapi.
      - |
        npm install -g @usebruno/cli@2.15.0 > /tmp/bruno-install.log 2>&1 &
        bruno_pid=$$!
        go build -o wakapi
        if ! wait "$${bruno_pid}"; then cat /tmp/bruno-install.log; exit 1; fi
      - WAKAPI_TEST_SKIP_BUILD=1 ./testing/run_api_tests.sh postgres --migration
      - WAKAPI_TEST_SKIP_BUILD=1 ./testing/run_api_tests.sh sqlite
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi

services:
  - name: database
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: wakapi
      POSTGRES_PASSWORD: wakapi
      POSTGRES_DB: wakapi

concurrency:
  limit: 2
  group: wakapi-migration
