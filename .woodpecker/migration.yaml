# Wakapi migration test workflow. The fork only supports Postgres (plus the
# SQLite default covered by migration-sqlite), so MySQL/MariaDB are not tested.
when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: migration-tests
    image: dhi.io/golang:1.27.1-debian13-dev@sha256:e2e776afd69ca84181107b77325df3debb5e81f5386c6c4c4b0f5ab6681d8175
    environment:
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
      GOFLAGS: -mod=vendor
      WAKAPI_TEST_EXTERNAL_DB: "1"
      WAKAPI_DB_HOST: database
      WAKAPI_DB_PORT: "5432"
    commands:
      # Postgres runs only boot the last release and the current build against
      # the DB (no Bruno suite), so unzip is the only extra tool needed.
      - apt-get update
      - apt-get install -y --no-install-recommends unzip
      - ./testing/run_api_tests.sh postgres --migration
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi

services:
  - name: database
    image: postgres:18
    environment:
      POSTGRES_USER: wakapi
      POSTGRES_PASSWORD: wakapi
      POSTGRES_DB: wakapi

depends_on:
  - migration-sqlite

concurrency:
  limit: 2
  group: wakapi-migration
