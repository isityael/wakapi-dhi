# Wakapi migration test workflow. The fork only supports Postgres (plus the
# SQLite default covered by migration-sqlite), so MySQL/MariaDB are not tested.
when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: migration-tests
    image: golang:1.26.5-bookworm
    environment:
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
      GOFLAGS: -mod=vendor
      WAKAPI_TEST_EXTERNAL_DB: "1"
      WAKAPI_DB_HOST: database
      WAKAPI_DB_PORT: "5432"
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates curl gnupg sqlite3 unzip
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y --no-install-recommends nodejs
      - npm install -g @usebruno/cli@2.15.0
      - ./testing/run_api_tests.sh postgres --migration
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi

services:
  - name: database
    image: postgres:18
    environment:
      POSTGRES_USER: wakapi
      POSTGRES_PASSWORD: wakapi
      POSTGRES_DB: wakapi

depends_on:
  - migration-sqlite

concurrency:
  limit: 2
  group: wakapi-migration
