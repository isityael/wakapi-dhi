# Wakapi migration test workflow. The fork only supports Postgres (plus the
# SQLite default covered by migration-sqlite), so MySQL/MariaDB are not tested.
when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: migration-tests
    image: dhi.io/golang:1.27.1-alpine3.24-dev@sha256:8690ed7def62c94fec567dcd9803922f7c77fcfbd87f51106233c3ee2c81c705
    environment:
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
      GOFLAGS: -mod=vendor
      WAKAPI_TEST_EXTERNAL_DB: "1"
      WAKAPI_DB_HOST: database
      WAKAPI_DB_PORT: "5432"
    commands:
      # Postgres runs only boot the last release and the current build against
      # the DB (no Bruno suite); the image already ships unzip.
      - apk add --no-cache bash curl
      - ./testing/run_api_tests.sh postgres --migration
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi

services:
  - name: database
    image: postgres:18
    environment:
      POSTGRES_USER: wakapi
      POSTGRES_PASSWORD: wakapi
      POSTGRES_DB: wakapi

depends_on:
  - migration-sqlite

concurrency:
  limit: 2
  group: wakapi-migration
