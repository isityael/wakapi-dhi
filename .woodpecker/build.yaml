# Wakapi — DHI-hardened fork
# Builds and pushes to ghcr.io/isityael/wakapi-dhi
when:
  - event: manual
  - event: push
    branch: master
    path:
      include: [".woodpecker/build.yaml", "**/*.go", "go.*", "vendor/**", "dhi/**"]

steps:
  - name: build-and-push-ghcr
    image: woodpeckerci/plugin-docker-buildx:6.0.4@sha256:765ebfaa6f71383197babb2352c7902bafe141e6232a62cafb740510a788c550
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/wakapi-dhi
      dockerfile: dhi/wakapi.yaml
      platforms: linux/amd64
      tags:
        - "candidate-${CI_COMMIT_SHA}"
      build_args:
        COMMIT_SHA: "${CI_COMMIT_SHA}"
      cache_images:
        - ghcr.io/isityael/wakapi-dhi:buildcache
      logins:
        - registry: ghcr.io
          username: isityael
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max
      sbom: generator=dhi.io/scout-sbom-indexer:1

  - name: scan-candidate
    image: dhi.io/trivy:0.71.2-alpine3.24-dev@sha256:111c2d07f6a936c6429f5bb551899cdd662917b754ae5effcdd45c447cb5b5ab
    environment:
      TRIVY_USERNAME: isityael
      TRIVY_PASSWORD:
        from_secret: github_token
    commands:
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "ghcr.io/isityael/wakapi-dhi:candidate-$${CI_COMMIT_SHA}"

  - name: sign-candidate
    image: dhi.io/cosign:3.1.2-alpine3.24-dev@sha256:28bd97f1efc751593b4d75d4d92880353bf77ee43f8db391f704b699b7cce43e
    environment:
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
    commands:
      - printf '%s' "$${COSIGN_KEY}" > /tmp/cosign.key
      - cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 "ghcr.io/isityael/wakapi-dhi:candidate-$${CI_COMMIT_SHA}"
      - rm -f /tmp/cosign.key

  - name: promote-release
    image: dhi.io/crane:0.21.7-debian13-dev@sha256:5c8e6a602d0c668812c6645de88af5b1d69c1a1faa4b05facecd6678371f38b7
    environment:
      GHCR_USERNAME: isityael
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - printf '%s' "$${GHCR_TOKEN}" | crane auth login ghcr.io -u "$${GHCR_USERNAME}" --password-stdin
      - candidate="ghcr.io/isityael/wakapi-dhi:candidate-$${CI_COMMIT_SHA}"
      - short_sha="$$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-8)"
      - WAKAPI_VERSION="$$(sed -n 's/^[[:space:]]*WAKAPI_VERSION:[[:space:]]*//p' dhi/wakapi.yaml | head -n 1)"
      - test -n "$${WAKAPI_VERSION}"
      - |
        for alias in \
          "$${short_sha}" \
          "$${WAKAPI_VERSION}" \
          "$${WAKAPI_VERSION}-alpine3.24" \
          latest \
          latest-alpine3.24
        do
          crane copy "$${candidate}" "ghcr.io/isityael/wakapi-dhi:$${alias}"
        done
