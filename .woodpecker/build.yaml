# Wakapi — DHI-hardened fork
# Builds, scans, signs, and promotes git.m0sh1.cc/isityael/wakapi-dhi releases.
when:
  - event: tag
    ref: refs/tags/v*-yael.*

steps:
  - name: prepare-release-definition
    image: docker.io/library/busybox:1.38.0-musl@sha256:ea2b9914a16a4ac1981994af97b318f7c7d4db76b580c56177f08bf76f4a0be8
    commands:
      - .ci/prepare-dhi-release-definition.sh dhi/wakapi.yaml .ci/wakapi-release.yaml "$${CI_COMMIT_SHA}" "$${CI_COMMIT_TAG#v}"

  - name: build-and-push-forgejo
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: git.m0sh1.cc
      repo: git.m0sh1.cc/isityael/wakapi-dhi
      dockerfile: .ci/wakapi-release.yaml
      platforms: linux/amd64
      tags:
        - "candidate-${CI_COMMIT_SHA}"
      cache_from: 'type=registry\,ref=git.m0sh1.cc/isityael/wakapi-dhi:buildcache'
      logins:
        - registry: git.m0sh1.cc
          username: isityael
          password:
            from_secret: forgejo_public_package_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max
      sbom: generator=dhi.io/scout-sbom-indexer:1

  - name: scan-candidate
    image: dhi.io/trivy:0.74.0-alpine3.24-dev@sha256:c54ed1ca6ed018ca962d95c606458f1540746ac016b98f2f33c1be794ad38b4d
    environment:
      TRIVY_USERNAME: isityael
      TRIVY_PASSWORD:
        from_secret: forgejo_public_package_token
    commands:
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "git.m0sh1.cc/isityael/wakapi-dhi:candidate-$${CI_COMMIT_SHA}"

  - name: sign-candidate
    image: dhi.io/cosign:3.1.4-alpine3.24-dev@sha256:7572c01000040cf5e7118a25580cff348e1375b3fdbbb0e78eddfa97cd6196ba
    environment:
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      FORGEJO_USERNAME: isityael
      FORGEJO_TOKEN:
        from_secret: forgejo_public_package_token
    commands:
      - printf '%s' "$${COSIGN_KEY}" > /tmp/cosign.key
      - printf '%s' "$${FORGEJO_TOKEN}" | cosign login git.m0sh1.cc -u "$${FORGEJO_USERNAME}" --password-stdin
      - cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 "git.m0sh1.cc/isityael/wakapi-dhi:candidate-$${CI_COMMIT_SHA}"
      - rm -f /tmp/cosign.key

  - name: promote-release
    image: dhi.io/crane:0.22.1-debian13-dev@sha256:82b1dc28811889cba5bcab21f599349347944a11faee62dcd5cfc43b16d28838
    environment:
      FORGEJO_USERNAME: isityael
      FORGEJO_TOKEN:
        from_secret: forgejo_public_package_token
    commands:
      - printf '%s' "$${FORGEJO_TOKEN}" | crane auth login git.m0sh1.cc -u "$${FORGEJO_USERNAME}" --password-stdin
      - candidate="git.m0sh1.cc/isityael/wakapi-dhi:candidate-$${CI_COMMIT_SHA}"
      - short_sha="$$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-8)"
      - WAKAPI_VERSION="$$(sed -n 's/^[[:space:]]*WAKAPI_VERSION:[[:space:]]*//p' dhi/wakapi.yaml | head -n 1)"
      - test -n "$${WAKAPI_VERSION}"
      - release="$${CI_COMMIT_TAG#v}"
      - case "$${release}" in "$${WAKAPI_VERSION}-yael."*) ;; *) echo "tag $${CI_COMMIT_TAG} does not match WAKAPI_VERSION $${WAKAPI_VERSION}" >&2; exit 1;; esac
      - crane copy "$${candidate}" "git.m0sh1.cc/isityael/wakapi-dhi:$${release}"
      - |
        for alias in \
          "$${short_sha}" \
          "$${release}-alpine3.24" \
          latest \
          latest-alpine3.24
        do
          crane copy "$${candidate}" "git.m0sh1.cc/isityael/wakapi-dhi:$${alias}"
        done
