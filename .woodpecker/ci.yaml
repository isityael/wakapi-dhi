# Wakapi PR/push test workflow.
when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: workflow-contracts
    image: harbor.m0sh1.cc/apps/k8s-lint-tools:ci-contract-955439a6-600@sha256:08ded45a856932cfaec69c72dc9efddc24fd97083a143131497ccf8998f06bf3
    commands:
      - .ci/test-migration-workflow.sh
      - .ci/test-dhi-release-policy.sh

  # The SQLite Bruno API suite runs in migration-sqlite (--migration is a
  # superset of the plain run), so this step only needs the Go toolchain.
  - name: unit-tests
    image: dhi.io/golang:1.27.1-alpine3.24-dev@sha256:8690ed7def62c94fec567dcd9803922f7c77fcfbd87f51106233c3ee2c81c705
    environment:
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
      GOFLAGS: -mod=vendor
    commands:
      - go test $(go list ./... | grep -v 'github.com/muety/wakapi/scripts')

  - name: mail-tests
    image: dhi.io/golang:1.27.1-alpine3.24-dev@sha256:8690ed7def62c94fec567dcd9803922f7c77fcfbd87f51106233c3ee2c81c705
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=vendor
      WAKAPI_TEST_EXTERNAL_SMTP4DEV: "1"
      WAKAPI_TEST_SMTP4DEV_API_URL: http://smtp4dev/api
      WAKAPI_TEST_SMTP4DEV_HOST: smtp4dev
      WAKAPI_TEST_SMTP4DEV_PORT: "25"
    commands:
      - apk add --no-cache bash
      - ./testing/run_mail_tests.sh

services:
  - name: smtp4dev
    image: rnwood/smtp4dev:latest
