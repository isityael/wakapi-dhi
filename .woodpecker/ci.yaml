# Wakapi PR/push test workflow: workflow contracts plus one Go test run
# (unit tests and the smtp4dev-backed mail suite share a single compile).
when:
  - event: pull_request
  - event: push
    branch: master

# The workspace is on NFS, where writing vendor/ one file at a time made
# `git reset --hard` take ~55s. Parallel checkout overlaps those writes.
clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: checkout.workers
      GIT_CONFIG_VALUE_0: "16"

steps:
  - name: workflow-contracts
    image: harbor.m0sh1.cc/apps/k8s-lint-tools:ci-contract-955439a6-600@sha256:08ded45a856932cfaec69c72dc9efddc24fd97083a143131497ccf8998f06bf3
    commands:
      - .ci/test-migration-workflow.sh
      - .ci/test-dhi-release-policy.sh

  # GOFLAGS=-mod=vendor fails on any go.mod/vendor/modules.txt mismatch, so
  # this also enforces vendor consistency without a module download.
  - name: go-tests
    image: dhi.io/golang:1.27.1-alpine3.24-dev@sha256:8690ed7def62c94fec567dcd9803922f7c77fcfbd87f51106233c3ee2c81c705
    environment:
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
      GOFLAGS: -mod=vendor
      WAKAPI_TEST_SMTP4DEV_API_URL: http://smtp4dev/api
      WAKAPI_TEST_SMTP4DEV_HOST: smtp4dev
      WAKAPI_TEST_SMTP4DEV_PORT: "25"
    commands:
      # TestSmtpTestSuite skips itself when smtp4dev is unreachable; fail
      # instead of silently dropping the mail coverage.
      - for i in $(seq 1 60); do nc -z smtp4dev 25 && break; sleep 1; done; nc -z smtp4dev 25
      - go test -count=1 $(go list ./... | grep -v '/scripts')

services:
  - name: smtp4dev
    image: rnwood/smtp4dev:latest
