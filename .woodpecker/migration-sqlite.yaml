# Wakapi SQLite migration test workflow. SQLite needs no service container.
when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: sqlite-migration-tests
    image: dhi.io/golang:1.27.1-debian13-dev@sha256:e2e776afd69ca84181107b77325df3debb5e81f5386c6c4c4b0f5ab6681d8175
    environment:
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
      GOFLAGS: -mod=vendor
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates curl gnupg sqlite3 unzip
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y --no-install-recommends nodejs
      - npm install -g @usebruno/cli@2.15.0
      - ./testing/run_api_tests.sh sqlite --migration
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi

depends_on:
  - ci
