# Wakapi SQLite migration test workflow. SQLite needs no service container.
when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: sqlite-migration-tests
    image: dhi.io/golang:1.27.1-alpine3.24-dev@sha256:8690ed7def62c94fec567dcd9803922f7c77fcfbd87f51106233c3ee2c81c705
    environment:
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
      GOFLAGS: -mod=vendor
    commands:
      - apk add --no-cache bash curl sqlite nodejs npm
      - npm install -g @usebruno/cli@2.15.0
      - ./testing/run_api_tests.sh sqlite --migration
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi

depends_on:
  - ci
